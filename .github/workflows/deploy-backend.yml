name: Deploy Supabase backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/verify-deployment.mjs"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MIGRATIONS_BASELINED: ${{ vars.SUPABASE_MIGRATIONS_BASELINED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npm run verify:repo
      - name: Guard an existing manually-managed production database
        run: |
          if [ "$MIGRATIONS_BASELINED" != "true" ]; then
            echo "Production migration history has not been baselined. Follow supabase/BASELINE.md first."
            exit 1
          fi
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview database changes
        run: supabase db push --dry-run
      - name: Apply database migrations
        run: supabase db push
      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
      - name: Read-only smoke tests
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/engagements?select=id&limit=1" > /dev/null
          curl --fail --silent --show-error \
            -X POST -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"action":"health"}' \
            "$SUPABASE_URL/functions/v1/portal" > /dev/null
